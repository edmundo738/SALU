# SALU — frontend estático no Netlify, API persistente fora do Netlify.
# Define VITE_API_URL no painel do Netlify (ex.: https://api.salu.ao/api).
# O SQLite local NUNCA é usado como base de produção serverless.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# O proxy das fotografias (/media/* -> API) vive em public/_redirects.
# Não repetir aqui: as regras de _redirects são processadas primeiro e um /* no
# fim deste ficheiro nunca chegaria a ser lido.

# Sem VITE_API_URL, /api não pode devolver index.html em silêncio.
[[redirects]]
  from = "/api/*"
  to = "/api-unavailable.json"
  status = 503
  force = true

# Um asset em falta devolve 404, não o index.html.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Rotas profundas do React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # As fotografias vivem no servidor da API (outro domínio), por isso
    # img-src tem de permitir https: — sem isto a foto sobe bem mas não aparece.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# A versão é consultada sem cache para detectar uma nova publicação.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
